<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Branchstorm — ideias que se ramificam</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Branchstorm é a plataforma colaborativa para evoluir, validar e versionar ideias em árvore." />
    <meta name="theme-color" content="#f6fafa" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="brand/leaf-green.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet" />
    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      (function () {
        try {
          var stored = localStorage.getItem('bs.theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.dataset.theme = stored;
            document.documentElement.style.colorScheme = stored;
          }
        } catch (error) {
          /* ignore storage access errors */
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
